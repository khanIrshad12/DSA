<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1a16" />
      <stop offset="100%" stop-color="#12100e" />
    </linearGradient>
    <linearGradient id="orange-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffaa64" />
      <stop offset="100%" stop-color="#ff7315" />
    </linearGradient>
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Squircle Backdrop -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg-grad)" stroke="#3b342c" stroke-width="1.5" />

  <!-- Graph / Tree Edges -->
  <line x1="32" y1="18" x2="18" y2="44" stroke="url(#orange-grad)" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)" />
  <line x1="32" y1="18" x2="46" y2="44" stroke="url(#cyan-grad)" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)" />
  <line x1="18" y1="44" x2="46" y2="44" stroke="rgba(255,255,255,0.25)" stroke-width="2" stroke-dasharray="3 3" />

  <!-- Root Node (Amber Orange) -->
  <circle cx="32" cy="18" r="8" fill="#7c2d12" stroke="url(#orange-grad)" stroke-width="2.5" filter="url(#glow)" />
  <circle cx="32" cy="18" r="3.5" fill="#fff" />

  <!-- Left Child Node (Emerald / Orange) -->
  <circle cx="18" cy="44" r="7.5" fill="#14532d" stroke="#34d399" stroke-width="2.5" filter="url(#glow)" />
  <circle cx="18" cy="44" r="3" fill="#fff" />

  <!-- Right Child Node (Cyan) -->
  <circle cx="46" cy="44" r="7.5" fill="#082f49" stroke="url(#cyan-grad)" stroke-width="2.5" filter="url(#glow)" />
  <circle cx="46" cy="44" r="3" fill="#fff" />
</svg>
